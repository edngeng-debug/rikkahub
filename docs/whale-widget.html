<!doctype html>
<html lang="zh-CN">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>小鲸鱼记账</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0f1115;color:#f5f7fb;font-family:system-ui,-apple-system,sans-serif}main{max-width:680px;margin:auto;min-height:100vh;padding:16px}.card{background:#191c22;border:1px solid #2c3039;border-radius:22px;padding:16px;margin-bottom:14px}.hero{display:flex;align-items:center;gap:14px}.whale{width:76px;height:76px;border-radius:25px;background:#242a35;display:grid;place-items:center;font-size:46px;user-select:none}.title{font-size:21px;font-weight:800}.sub,.hint,.label{color:#aab1be;font-size:13px}.sub{margin-top:4px}.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0}.value{font-weight:750;font-variant-numeric:tabular-nums}.big{font-size:25px}.positive{color:#7fe0a1}.danger{color:#ff8e8e}input,button{width:100%;padding:13px;border-radius:14px;font-size:15px}input{background:#11141a;color:#fff;border:1px solid #3a3f4a;outline:none;margin:8px 0}button{border:0;background:#78a9ff;color:#08101f;font-weight:800;margin-top:8px}button.secondary{background:#292e38;color:#fff}button.dangerbtn{background:#3a2528;color:#ffb1b1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid button{margin:0}.section-title{font-weight:750;margin-bottom:8px}.progress{height:9px;background:#2a2e36;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:#78a9ff;border-radius:99px}.history{max-height:260px;overflow:auto}.history-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid #292d35;font-size:13px}.muted{color:#8e96a4}.badge{padding:3px 8px;border-radius:99px;background:#292e38;font-size:11px}.footer{padding:2px 4px 20px;line-height:1.6}.bubble{position:fixed;z-index:30;max-width:260px;padding:10px 13px;border-radius:16px;background:#f5f7fb;color:#151820;font-size:13px;font-weight:650;box-shadow:0 8px 25px rgba(0,0,0,.35);animation:pop .22s ease-out;pointer-events:none}.bubble:after{content:'';position:absolute;left:24px;bottom:-7px;border:7px solid transparent;border-top-color:#f5f7fb;border-bottom:0}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}
</style></head>
<body><main>
<div class="card hero"><div class="whale" id="whale">🐋</div><div><div class="title">小鲸鱼记账</div><div class="sub">RikkaHub 移动版 · DeepSeek Balance Whale</div></div></div>
<div class="card"><div class="row"><span class="label">账户余额</span><span class="value big" id="balance">—</span></div><div class="row"><span class="label">今日已用</span><span class="value" id="today">¥0.0000</span></div><div class="row"><span class="label">上次刷新</span><span class="value" id="time">—</span></div><div class="row"><span class="label">自动刷新</span><span class="badge">每 60 秒</span></div></div>
<div class="card"><div class="section-title">小鲸鱼</div><div class="hint">点击鲸鱼可以随机说话。</div><div class="row"><span class="label">今日说话</span><span class="value" id="bubbleCount">0</span></div><button class="secondary" onclick="showBubble()">让小鲸鱼说一句</button></div>
<div class="card"><div class="section-title">DeepSeek API Key</div><input id="key" type="password" placeholder="sk-..." autocomplete="off"><div class="grid"><button onclick="saveAndRefresh()">保存并刷新</button><button class="secondary" onclick="refresh()">立即刷新</button></div><div class="grid" style="margin-top:8px"><button class="secondary" onclick="toggleKey()">显示 / 隐藏 Key</button><button class="dangerbtn" onclick="forgetKey()">清除 Key</button></div><div id="status" class="hint" style="margin-top:10px">Key 只保存在本机 WebView localStorage。</div></div>
<div class="card"><div class="section-title">今日预算</div><div class="row"><span class="label">预算上限</span><span class="value" id="budgetText">未设置</span></div><div class="progress"><div class="bar" id="budgetBar"></div></div><input id="budget" type="number" min="0" step="0.01" placeholder="例如 2.00（元）"><button class="secondary" onclick="saveBudget()">保存预算</button><div id="budgetStatus" class="hint" style="margin-top:8px">达到预算后提醒。</div></div>
<div class="card"><div class="section-title">余额预警</div><div class="row"><span class="label">预警阈值</span><span class="value" id="warningText">未设置</span></div><input id="warning" type="number" min="0" step="0.01" placeholder="例如 5.00（元）"><button class="secondary" onclick="saveWarning()">保存预警</button><div id="warningStatus" class="hint" style="margin-top:8px">余额低于阈值后提醒。</div></div>
<div class="card"><div class="section-title">今日观测记录</div><div id="history" class="history"><div class="muted">暂无记录</div></div><div class="grid" style="margin-top:10px"><button class="secondary" onclick="resetToday()">重置今日</button><button class="dangerbtn" onclick="clearAll()">清除全部</button></div></div>
<div class="footer hint">今日已用采用余额下降额累计。充值或退款导致余额上升不会算作消耗；网络异常时保留最近成功数据。</div>
</main><div id="bubbleLayer"></div>
<script>
const K='rikkahub_whale_key',B='rikkahub_whale_balance',D='rikkahub_whale_day',U='rikkahub_whale_today',H='rikkahub_whale_history',BT='rikkahub_whale_budget',WT='rikkahub_whale_warning',T='rikkahub_whale_time',BC='rikkahub_whale_bubble_count';
const $=id=>document.getElementById(id),key=$('key');const sayings=['今天也要理性使用 API 哦～','鲸鱼正在帮你看余额！','别让 Token 偷偷溜走啦～','今天的预算还够吗？','啵！刷新成功～','我会帮你记住今天花了多少。','余额下降一点点，我都看见啦。','慢慢用，别把 Key 喂胖了。'];
key.value=localStorage.getItem(K)||'';$('budget').value=localStorage.getItem(BT)||'';$('warning').value=localStorage.getItem(WT)||'';
function day(){return new Date().toLocaleDateString('en-CA')}function money(n){return Number.isFinite(n)?'¥'+n.toFixed(4):'—'}function status(t,e=false){$('status').textContent=t;$('status').className='hint '+(e?'danger':'positive')}
function ensureDay(){if(localStorage.getItem(D)!==day()){localStorage.setItem(D,day());localStorage.setItem(U,'0');localStorage.setItem(H,'[]');localStorage.setItem(BC,'0')}}
function load(){ensureDay();const b=Number(localStorage.getItem(B)),u=Number(localStorage.getItem(U)||0),budget=Number(localStorage.getItem(BT)),warning=Number(localStorage.getItem(WT));$('balance').textContent=money(b);$('today').textContent=money(u);$('time').textContent=localStorage.getItem(T)||'—';$('budgetText').textContent=budget>0?money(budget):'未设置';$('warningText').textContent=warning>0?money(warning):'未设置';$('bubbleCount').textContent=localStorage.getItem(BC)||'0';const pct=budget>0?Math.min(100,u/budget*100):0;$('budgetBar').style.width=pct+'%';$('budgetStatus').textContent=budget>0?(u>=budget?'⚠️ 今日预算已达到或超出。':'已使用 '+pct.toFixed(1)+'%'):'达到预算后提醒。';$('budgetStatus').className='hint '+(budget>0&&u>=budget?'danger':'');$('warningStatus').textContent=warning>0&&Number.isFinite(b)&&b<=warning?'⚠️ 当前余额低于预警阈值。':'余额低于阈值后提醒。';$('warningStatus').className='hint '+(warning>0&&Number.isFinite(b)&&b<=warning?'danger':'');renderHistory()}
function renderHistory(){let a=[];try{a=JSON.parse(localStorage.getItem(H)||'[]')}catch{}if(!a.length){$('history').innerHTML='<div class="muted">暂无记录</div>';return}$('history').innerHTML=a.slice().reverse().map(x=>'<div class="history-row"><span>'+x.time+'</span><span>'+money(x.balance)+'</span><span class="'+(x.delta>0?'danger':'muted')+'">'+(x.delta>0?'−'+money(x.delta):'基准')+'</span></div>').join('')}
async function refresh(){ensureDay();const k=localStorage.getItem(K)||key.value.trim();if(!k){status('请先填写 API Key',true);return}status('正在刷新…');try{const r=await fetch('https://api.deepseek.com/user/balance',{headers:{Authorization:'Bearer '+k,Accept:'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json(),infos=j.balance_infos||[],c=infos.find(x=>x.currency==='CNY')||infos[0],now=Number(c&&c.total_balance);if(!Number.isFinite(now))throw Error('接口未返回有效余额');const old=Number(localStorage.getItem(B));let delta=0;if(Number.isFinite(old)&&now<old){delta=old-now;localStorage.setItem(U,String(Number(localStorage.getItem(U)||0)+delta))}localStorage.setItem(B,String(now));localStorage.setItem(D,day());localStorage.setItem(T,new Date().toLocaleTimeString());let h=[];try{h=JSON.parse(localStorage.getItem(H)||'[]')}catch{}h.push({time:new Date().toLocaleTimeString(),balance:now,delta});localStorage.setItem(H,JSON.stringify(h.slice(-200)));load();status('刷新成功');showBubble(delta>0?'刚刚消耗了 '+money(delta)+'，小鲸鱼记账完成～':'余额刷新成功，目前还有 '+money(now)+'。')}catch(e){load();status('刷新失败：'+e.message,true)}}
function saveAndRefresh(){const v=key.value.trim();if(!v){forgetKey();return}localStorage.setItem(K,v);refresh()}function toggleKey(){key.type=key.type==='password'?'text':'password'}function forgetKey(){localStorage.removeItem(K);key.value='';status('已清除本机保存的 API Key')}function saveBudget(){const v=Number($('budget').value);if(v>0)localStorage.setItem(BT,String(v));else localStorage.removeItem(BT);load()}function saveWarning(){const v=Number($('warning').value);if(v>0)localStorage.setItem(WT,String(v));else localStorage.removeItem(WT);load()}
function showBubble(text){ensureDay();const b=document.createElement('div');b.className='bubble';b.textContent=text||sayings[Math.floor(Math.random()*sayings.length)];b.style.right='20px';b.style.bottom='30px';$('bubbleLayer').appendChild(b);const n=Number(localStorage.getItem(BC)||0)+1;localStorage.setItem(BC,String(n));$('bubbleCount').textContent=n;setTimeout(()=>b.remove(),3600)}$('whale').addEventListener('click',()=>showBubble());
function resetToday(){if(confirm('确定重置今天的记账数据吗？')){localStorage.setItem(U,'0');localStorage.setItem(H,'[]');localStorage.removeItem(B);load();status('今日记账已重置')}}function clearAll(){if(confirm('确定清除全部本地数据吗？')){[K,B,D,U,H,BT,WT,T,BC].forEach(x=>localStorage.removeItem(x));key.value='';$('budget').value='';$('warning').value='';load();status('全部本地数据已清除')}}
load();setInterval(()=>{if(localStorage.getItem(K))refresh()},60000);
</script></body></html>
