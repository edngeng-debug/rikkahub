name: Build complete DaFeiYu

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/dafeiyu-v2.yml'
      - 'app/src/main/**'
      - 'app/build.gradle.kts'
      - 'gradle/**'

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[dafeiyu-finished]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync RikkaHub upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/rikkahub/rikkahub.git || true
          git fetch upstream master --depth=200
          if ! git merge-base --is-ancestor upstream/master HEAD; then
            git merge upstream/master --no-edit -X ours
          fi

      - name: Import latest whale package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/whale-pkg app/src/main/assets/dafeiyu
          PKG="$(npm pack dsh-whale-widget@0.3.1 --silent)"
          tar -xzf "$PKG" -C /tmp/whale-pkg
          SRC=/tmp/whale-pkg/package/assets
          test -f "$SRC/whale-widget.js"
          cp -f "$SRC/whale-widget.js" app/src/main/assets/dafeiyu/whale-widget.js
          for f in DSniang1.png DSniang02.png rua.gif Ya1.mp3 Ya2.mp3 D1.mp3 D2.mp3 minecraft-exp-orb.wav task-end-a.wav bubble-petpet.gif bubble-money1.gif; do
            if test -f "$SRC/$f"; then cp -f "$SRC/$f" "app/src/main/assets/dafeiyu/$f"; fi
          done

      - name: Patch whale visual behavior for embedded mode
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/assets/dafeiyu/whale-widget.js')
          s = p.read_text(encoding='utf-8')
          marker = "\n/* RikkaHub embedded interaction patch */\n"
          if marker in s:
              s = s.split(marker, 1)[0]
          patch = r'''
          (function(){
            if (!window.__RIKKAHUB_DAFEIYU_EMBEDDED) return;
            var style=document.createElement('style');
            style.textContent=[
              '.dshwv-body{transform:none!important;animation:none!important;transition:none!important}',
              '.dshwv-bubble,.dshwv-bubble-open,.dshwv-text,.dshwv-gif{display:none!important;opacity:0!important;visibility:hidden!important}',
              '.dshwv-menu-btn,.dshwv-menu{display:none!important}'
            ].join('');
            document.head.appendChild(style);
          })();
          '''
          p.write_text(s + marker + patch, encoding='utf-8')

      - name: Verify embedded visual patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q '__RIKKAHUB_DAFEIYU_EMBEDDED' app/src/main/assets/dafeiyu/whale-widget.js
          grep -q 'dshwv-bubble,.dshwv-bubble-open' app/src/main/assets/dafeiyu/whale-widget.js

      - name: Prepare debug Google Services stub
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/debug
          cat > app/src/debug/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "0",
              "project_id": "rikkahub-debug",
              "storage_bucket": "rikkahub-debug.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:0:android:0000000000000000",
                  "android_client_info": {"package_name": "me.rerere.rikkahub"}
                },
                "api_key": [{"current_key": "AIzaSyDUMMY_FOR_LOCAL_DEBUG_BUILD_ONLY"}]
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail
          find app/build/outputs/apk -type f -name '*.apk' -print
          test -n "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-dafeiyu-complete-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Commit synced sources and patched assets
        shell: bash
        run: |
          set -euo pipefail
          rm -f app/src/debug/google-services.json
          git add app/src/main/assets/dafeiyu/whale-widget.js app/src/main/assets/dafeiyu/ app/src/main/java/me/rerere/rikkahub/whale app/src/main/java/me/rerere/rikkahub/ui/pages/extensions .github/workflows/dafeiyu-v2.yml
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m '[dafeiyu-finished] sync upstream and finish interaction/settings fixes'
            git push origin HEAD:master
          fi
