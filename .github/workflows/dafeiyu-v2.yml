name: Build complete DaFeiYu

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/dafeiyu-v2.yml'
      - 'app/src/main/**'
      - 'app/build.gradle.kts'
      - 'gradle/**'

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[dafeiyu-finished]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync RikkaHub upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/rikkahub/rikkahub.git || true
          git fetch upstream master --depth=200
          if ! git merge-base --is-ancestor upstream/master HEAD; then
            git merge upstream/master --no-edit -X ours
          fi

      - name: Import latest whale package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/whale-pkg app/src/main/assets/dafeiyu
          PKG="$(npm pack dsh-whale-widget@0.3.1 --silent)"
          tar -xzf "$PKG" -C /tmp/whale-pkg
          SRC=/tmp/whale-pkg/package/assets
          test -f "$SRC/whale-widget.js"
          cp -f "$SRC/whale-widget.js" app/src/main/assets/dafeiyu/whale-widget.js
          for f in DSniang1.png DSniang02.png rua.gif Ya1.mp3 Ya2.mp3 D1.mp3 D2.mp3 minecraft-exp-orb.wav task-end-a.wav bubble-petpet.gif bubble-money1.gif; do
            if test -f "$SRC/$f"; then cp -f "$SRC/$f" "app/src/main/assets/dafeiyu/$f"; fi
          done

      - name: Patch whale for RikkaHub embedded mode
        shell: python
        run: |
          import re
          from pathlib import Path
          p = Path('app/src/main/assets/dafeiyu/whale-widget.js')
          s = p.read_text(encoding='utf-8')

          marker = "\n/* RikkaHub embedded interaction patch */\n"
          patch = r'''
          (function(){
            if (!window.__RIKKAHUB_DAFEIYU_EMBEDDED) return;
            var style=document.createElement('style');
            style.textContent=[
              '.dshwv-body{transform:none!important;animation:none!important;transition:none!important}',
              '.dshwv-bubble,.dshwv-bubble-open,.dshwv-text,.dshwv-gif{display:none!important;opacity:0!important;visibility:hidden!important}',
              '.dshwv-menu-btn,.dshwv-menu{display:none!important}'
            ].join('');
            document.head.appendChild(style);
          })();
          '''

          def scope_between(text, start, end):
              a = text.find(start)
              if a < 0: raise SystemExit(f'missing scope start: {start}')
              b = text.find(end, a + len(start))
              if b < 0: raise SystemExit(f'missing scope end: {end}')
              return a, b

          # Drag move: replace the first left/top clamp inside the pointer-move handler.
          a, b = scope_between(s, 'function onDocPointerMove', 'function onDocPointerUp')
          body = s[a:b]
          body, n1 = re.subn(r'state\.left\s*=\s*clamp\([^;]+\);', 'state.left = drag.origLeft + dx;', body, count=1)
          body, n2 = re.subn(r'state\.top\s*=\s*clamp\([^;]+\);', 'state.top = drag.origTop + dy;', body, count=1)
          if n1 != 1 or n2 != 1: raise SystemExit('drag move clamp pattern missing')
          s = s[:a] + body + s[b:]

          # Drag release: remove final clamp and the snap/settle call.
          a, b = scope_between(s, 'function endDrag', 'function applyAnchorPos')
          body = s[a:b]
          body, n1 = re.subn(r'const left\s*=\s*clamp\([^;]+\);', 'const left = drag.origLeft + dx;', body, count=1)
          body, n2 = re.subn(r'const top\s*=\s*clamp\([^;]+\);', 'const top = drag.origTop + dy;', body, count=1)
          if n1 != 1 or n2 != 1: raise SystemExit('drag release clamp pattern missing')
          body, n3 = re.subn(
              r'state\.left\s*=\s*left;\s*state\.top\s*=\s*top;\s*settle\(\);\s*saveConfig\(\);',
              'state.left = left;\n        state.top = top;\n        state.h = null;\n        state.v = null;\n        state.hOff = left;\n        state.vOff = top;\n        express();\n        saveConfig();',
              body, count=1)
          if n3 != 1: raise SystemExit('drag release settle pattern missing')
          s = s[:a] + body + s[b:]

          # Free-floating positions must survive resize without automatic re-snapping.
          s, n4 = re.subn(
              r"window\.addEventListener\('resize',\s*function\s*\(\)\s*\{.*?\}\);",
              "window.addEventListener('resize', function () {\n        if (state.h === null && state.v === null) { express(); return; }\n        settle();\n      });",
              s, count=1, flags=re.S)
          if n4 != 1: raise SystemExit('resize handler pattern missing')

          # After the original config is loaded, embedded mode stops using edge anchors.
          s, n5 = re.subn(
              r'loadConfig\(\);\s*\}\)\(\);',
              "loadConfig();\n      if (window.__RIKKAHUB_DAFEIYU_EMBEDDED) { state.h = null; state.v = null; express(); }\n    })();",
              s, count=1)
          if n5 != 1: raise SystemExit('init pattern missing')

          p.write_text(s + marker + patch, encoding='utf-8')

      - name: Verify whale patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q '__RIKKAHUB_DAFEIYU_EMBEDDED' app/src/main/assets/dafeiyu/whale-widget.js
          grep -q 'state.left = drag.origLeft + dx' app/src/main/assets/dafeiyu/whale-widget.js
          grep -q 'dshwv-bubble,.dshwv-bubble-open' app/src/main/assets/dafeiyu/whale-widget.js

      - name: Build ARM64 debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleArm64Debug --stacktrace

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-dafeiyu-complete-arm64
          path: app/build/outputs/apk/debug/*arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Commit synced sources and patched assets
        shell: bash
        run: |
          set -euo pipefail
          git add app/src/main/assets/dafeiyu/whale-widget.js app/src/main/assets/dafeiyu/ app/src/main/java/me/rerere/rikkahub/whale app/src/main/java/me/rerere/rikkahub/ui/pages/extensions .github/workflows/dafeiyu-v2.yml
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m '[dafeiyu-finished] sync upstream and finish interaction/settings fixes'
            git push origin HEAD:master
          fi
