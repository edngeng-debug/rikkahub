name: Build 大肥鱼 APK

on:
  push:
    paths:
      - 'app/src/main/java/me/rerere/rikkahub/whale/DaFeiYuWidget.kt'
      - 'app/src/main/java/me/rerere/rikkahub/whale/DaFeiYuSettings.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/extensions/DaFeiYuSettingsPage.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/extensions/ExtensionsPage.kt'
      - 'app/src/main/assets/dafeiyu/debug.js'
      - 'app/src/main/assets/dafeiyu/whale-widget.js'
      - '.github/workflows/finish-dafeiyu.yml'
permissions:
  contents: write
concurrency:
  group: dafeiyu-build
  cancel-in-progress: true
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[dafeiyu-finished]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile
      - name: Patch build-only dependencies and finish 大肥鱼 integration
        shell: python
        run: |
          from pathlib import Path
          vm = Path('app/src/main/java/me/rerere/rikkahub/ui/pages/chat/ChatVM.kt')
          s = vm.read_text()
          s = s.replace('import com.google.firebase.analytics.FirebaseAnalytics\n', '')
          s = s.replace('    private val analytics: FirebaseAnalytics,\n', '')
          for line in ['        analytics.logEvent("ai_send_message", null)\n\n','        analytics.logEvent("ai_edit_message", null)\n\n','        analytics.logEvent("ai_regenerate_at_message", null)\n','        analytics.logEvent("ai_tool_approval", null)\n','        analytics.logEvent("ai_tool_answer", null)\n']:
              s = s.replace(line, '')
          vm.write_text(s)
          mod = Path('app/src/main/java/me/rerere/rikkahub/di/ViewModelModule.kt')
          mod.write_text(mod.read_text().replace('            analytics = get(),\n', ''))
          route = Path('app/src/main/java/me/rerere/rikkahub/RouteActivity.kt')
          s = route.read_text()
          if 'import me.rerere.rikkahub.ui.pages.extensions.DaFeiYuSettingsPage' not in s:
              s = s.replace('import me.rerere.rikkahub.ui.pages.extensions.ExtensionsPage\n', 'import me.rerere.rikkahub.ui.pages.extensions.ExtensionsPage\nimport me.rerere.rikkahub.ui.pages.extensions.DaFeiYuSettingsPage\n')
          if 'entry<Screen.DaFeiYuSettings>' not in s:
              anchor = '''                            entry<Screen.Extensions> {\n                                ExtensionsPage()\n                            }\n'''
              s = s.replace(anchor, anchor + '''\n                            entry<Screen.DaFeiYuSettings> {\n                                DaFeiYuSettingsPage()\n                            }\n''')
          if 'data object DaFeiYuSettings : Screen' not in s:
              s = s.replace('    @Serializable\n    data object Extensions : Screen\n', '    @Serializable\n    data object Extensions : Screen\n\n    @Serializable\n    data object DaFeiYuSettings : Screen\n')
          route.write_text(s)

          # Full-screen transparent WebView: JS keeps the real viewport, so its
          # native drag math has the actual screen size instead of a 250dp viewport.
          widget = Path('app/src/main/java/me/rerere/rikkahub/whale/DaFeiYuWidget.kt')
          s = widget.read_text()
          start = s.index('@SuppressLint("SetJavaScriptEnabled")\n@Composable\nfun DaFeiYuWidget')
          host_end = s.index('\n@SuppressLint("SetJavaScriptEnabled")\nprivate class DaFeiYuHostView', start)
          new_composable = '''@SuppressLint("SetJavaScriptEnabled")\n@Composable\nfun DaFeiYuWidget(modifier: Modifier = Modifier) {\n    val context = LocalContext.current\n    val settings = LocalSettings.current\n    val client: OkHttpClient = koinInject()\n    val eventBus: AppEventBus = koinInject()\n    var host by remember { mutableStateOf<DaFeiYuHostView?>(null) }\n    AndroidView(\n        factory = { DaFeiYuHostView(context, client, settings).also { host = it } },\n        update = { it.updateSettings(settings) },\n        modifier = modifier.fillMaxSize(),\n    )\n    LaunchedEffect(eventBus) {\n        eventBus.events.collectLatest { event ->\n            if (event is AppEvent.ChatGenerationEnded) host?.refreshBalance()\n        }\n    }\n}\n'''
          s = s[:start] + new_composable + s[host_end:]
          s = s.replace('''    settings: Settings,\n    private val onMove: (Float, Float) -> Unit,\n) : FrameLayout(context) {''', '''    settings: Settings,\n) : FrameLayout(context) {''', 1)
          # Full-screen WebView; the parent decides whether a touch is inside the
          # visible widget before allowing it into the WebView, so blank areas still pass through.
          s = s.replace('''        webView.layoutParams = LayoutParams(LayoutParams.MATCH_PARENT, LayoutParams.MATCH_PARENT)''', '''        webView.layoutParams = LayoutParams(LayoutParams.MATCH_PARENT, LayoutParams.MATCH_PARENT)''', 1)
          old_fields = '''    private var widgetX = 0f\n    private var widgetY = 0f\n    private var widgetReady = false\n    private val widgetSizePx get() = 250f * resources.displayMetrics.density\n'''
          new_fields = '''    @Volatile private var widgetLeft = Float.POSITIVE_INFINITY\n    @Volatile private var widgetTop = Float.POSITIVE_INFINITY\n    @Volatile private var widgetRight = Float.NEGATIVE_INFINITY\n    @Volatile private var widgetBottom = Float.NEGATIVE_INFINITY\n    private var gestureInside = false\n'''
          if old_fields in s: s = s.replace(old_fields, new_fields, 1)
          else:
              raise SystemExit('missing widget position fields')
          start_touch = s.index('    override fun onAttachedToWindow()')
          end_touch = s.index('\n    fun refreshBalance()', start_touch)
          new_touch = '''    fun updateWidgetRect(left: Float, top: Float, right: Float, bottom: Float) {\n        widgetLeft = left\n        widgetTop = top\n        widgetRight = right\n        widgetBottom = bottom\n    }\n\n    override fun dispatchTouchEvent(event: android.view.MotionEvent): Boolean {\n        val x = event.x\n        val y = event.y\n        when (event.actionMasked) {\n            android.view.MotionEvent.ACTION_DOWN -> {\n                val inside = x >= widgetLeft && x <= widgetRight && y >= widgetTop && y <= widgetBottom\n                if (!inside) { gestureInside = false; return false }\n                gestureInside = true\n            }\n            android.view.MotionEvent.ACTION_UP, android.view.MotionEvent.ACTION_CANCEL -> {\n                if (!gestureInside) return false\n            }\n            else -> if (!gestureInside) return false\n        }\n        val handled = super.dispatchTouchEvent(event)\n        if (event.actionMasked == android.view.MotionEvent.ACTION_UP || event.actionMasked == android.view.MotionEvent.ACTION_CANCEL) gestureInside = false\n        return handled || gestureInside\n    }\n\n    fun updateSettings(value: Settings) { currentSettings = value }\n'''
          s = s[:start_touch] + new_touch + s[end_touch:]
          s = s.replace('''    @JavascriptInterface fun moveWidgetBy(dx: Float, dy: Float) = host.moveWidgetBy(dx, dy)''', '''    @JavascriptInterface fun moveWidgetBy(@Suppress("UNUSED_PARAMETER") dx: Float, @Suppress("UNUSED_PARAMETER") dy: Float) = Unit''')
          s = s.replace('''    @JavascriptInterface fun setWidgetRect(@Suppress("UNUSED_PARAMETER") left: Float, @Suppress("UNUSED_PARAMETER") top: Float, @Suppress("UNUSED_PARAMETER") right: Float, @Suppress("UNUSED_PARAMETER") bottom: Float, @Suppress("UNUSED_PARAMETER") viewportWidth: Float, @Suppress("UNUSED_PARAMETER") viewportHeight: Float) = Unit''', '''    @JavascriptInterface fun setWidgetRect(left: Float, top: Float, right: Float, bottom: Float, @Suppress("UNUSED_PARAMETER") viewportWidth: Float, @Suppress("UNUSED_PARAMETER") viewportHeight: Float) = host.updateWidgetRect(left, top, right, bottom)''')
          widget.write_text(s)

          # Embedded debug bridge no longer hijacks pointer events or moves the Android view.
          debug = Path('app/src/main/assets/dafeiyu/debug.js')
          debug.write_text(r'''/* RikkaHub embedded host: full-screen transparent WebView, native whale drag stays in JS. */
(function(){
  if(window.__dshwDebugUi)return;
  window.__dshwDebugUi=true;
  function sync(){
    try{
      var menu=document.querySelector('.dshwv-menu');
      if(menu)menu.style.setProperty('display','none','important');
      var buttons=document.querySelectorAll('.dshwv-menu-btn,.dshwv-menu-btn-visible');
      for(var i=0;i<buttons.length;i++)buttons[i].style.setProperty('display','none','important');
    }catch(e){}
  }
  setTimeout(sync,120);
  setInterval(sync,1000);
})();
''')

          # Interaction requirements:
          # 1) remove squash/press animation in embedded mode;
          # 2) tapping the whale no longer creates a bubble;
          # 3/4) JS drag uses the full-screen WebView viewport and stays 1:1;
          # 5) the Extensions page already exposes the full editor, which mirrors
          # the original role/audio/bubble/resource/usage menus while hiding size.
          whale = Path('app/src/main/assets/dafeiyu/whale-widget.js')
          s = whale.read_text()
          s = s.replace("row1.appendChild(menuLabel('大小'))\nrow1.appendChild(scaleInput)\nrow1.appendChild(scaleNumber)", "row1.style.display = window.__RIKKAHUB_DAFEIYU_EMBEDDED ? 'none' : ''")
          s = s.replace("if (d && typeof d.scale === 'number' && d.scale >= MIN_SCALE - 0.1 && d.scale <= MAX_SCALE + 0.1) {", "if (!window.__RIKKAHUB_DAFEIYU_EMBEDDED && d && typeof d.scale === 'number' && d.scale >= MIN_SCALE - 0.1 && d.scale <= MAX_SCALE + 0.1) {")
          s = s.replace("  pressDown()\n  setWidgetCursor('grabbing')", "  if (!window.__RIKKAHUB_DAFEIYU_EMBEDDED) pressDown()\n  setWidgetCursor('grabbing')", 1)
          s = s.replace("  pressUp()\n  root.classList.remove('dshwv-dragging')", "  if (!window.__RIKKAHUB_DAFEIYU_EMBEDDED) pressUp()\n  root.classList.remove('dshwv-dragging')", 1)
          old_end = '''  if (clickAllowed && !drag.moved) {\n    // 长按刚唤出菜单:这次抬手不再当作点击(避免顺带弹出余额泡)\n    if (longPressRecent()) return\n    whaleClick()\n    refresh(true)\n    return\n  }'''
          new_end = '''  if (clickAllowed && !drag.moved) {\n    if (longPressRecent()) return\n    if (window.__RIKKAHUB_DAFEIYU_EMBEDDED) { refresh(true); return }\n    whaleClick()\n    refresh(true)\n    return\n  }'''
          if old_end not in s: raise SystemExit('missing click block')
          s = s.replace(old_end, new_end, 1)
          old_express = '''function express() {\n  root.style.right = 'auto'\n  root.style.bottom = 'auto'\n  root.style.left = state.left + 'px'\n  root.style.top = state.top + 'px'\n  root.classList.toggle('dshwv-left', !!state.flip)\n}'''
          new_express = '''function express() {\n  root.style.right = 'auto'\n  root.style.bottom = 'auto'\n  root.style.left = state.left + 'px'\n  root.style.top = state.top + 'px'\n  root.classList.toggle('dshwv-left', !!state.flip)\n  try {\n    if (window.RikkaDaFeiYu && RikkaDaFeiYu.setWidgetRect) {\n      var rr = root.getBoundingClientRect()\n      RikkaDaFeiYu.setWidgetRect(rr.left, rr.top, rr.right, rr.bottom, window.innerWidth || 0, window.innerHeight || 0)\n    }\n  } catch (err) {}\n}'''
          if old_express not in s: raise SystemExit('missing express block')
          s = s.replace(old_express, new_express, 1)
          whale.write_text(s)

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug -x processDebugGoogleServices
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-dafeiyu-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Commit fixed build sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot].users.noreply.github.com'
          git add app/src/main/java/me/rerere/rikkahub/ui/pages/chat/ChatVM.kt app/src/main/java/me/rerere/rikkahub/di/ViewModelModule.kt app/src/main/java/me/rerere/rikkahub/RouteActivity.kt app/src/main/java/me/rerere/rikkahub/whale/DaFeiYuWidget.kt app/src/main/assets/dafeiyu/debug.js app/src/main/assets/dafeiyu/whale-widget.js
          git commit -m 'fix: finish 大肥鱼 full-screen drag interaction [dafeiyu-finished]' || exit 0
          git push
