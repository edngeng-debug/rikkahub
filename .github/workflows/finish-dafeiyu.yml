name: Build 大肥鱼 APK

on:
  push:
    paths:
      - 'app/src/main/java/me/rerere/rikkahub/whale/DaFeiYuWidget.kt'
      - 'app/src/main/java/me/rerere/rikkahub/whale/DaFeiYuSettings.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/extensions/DaFeiYuSettingsPage.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/extensions/ExtensionsPage.kt'
      - 'app/src/main/assets/dafeiyu/debug.js'
      - '.github/workflows/finish-dafeiyu.yml'

permissions:
  contents: write

concurrency:
  group: dafeiyu-build
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[dafeiyu-finished]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Patch build-only dependencies and register 大肥鱼 settings route
        shell: python
        run: |
          from pathlib import Path
          vm = Path('app/src/main/java/me/rerere/rikkahub/ui/pages/chat/ChatVM.kt')
          s = vm.read_text()
          s = s.replace('import com.google.firebase.analytics.FirebaseAnalytics\n', '')
          s = s.replace('    private val analytics: FirebaseAnalytics,\n', '')
          s = s.replace('        analytics.logEvent("ai_send_message", null)\n\n', '')
          s = s.replace('        analytics.logEvent("ai_edit_message", null)\n\n', '')
          s = s.replace('        analytics.logEvent("ai_regenerate_at_message", null)\n', '')
          s = s.replace('        analytics.logEvent("ai_tool_approval", null)\n', '')
          s = s.replace('        analytics.logEvent("ai_tool_answer", null)\n', '')
          vm.write_text(s)

          mod = Path('app/src/main/java/me/rerere/rikkahub/di/ViewModelModule.kt')
          s = mod.read_text().replace('            analytics = get(),\n', '')
          mod.write_text(s)

          route = Path('app/src/main/java/me/rerere/rikkahub/RouteActivity.kt')
          s = route.read_text()
          if 'import me.rerere.rikkahub.ui.pages.extensions.DaFeiYuSettingsPage' not in s:
              anchor = 'import me.rerere.rikkahub.ui.pages.extensions.ExtensionsPage\n'
              s = s.replace(anchor, anchor + 'import me.rerere.rikkahub.ui.pages.extensions.DaFeiYuSettingsPage\n')
          if 'entry<Screen.DaFeiYuSettings>' not in s:
              anchor = '''                            entry<Screen.Extensions> {
                                ExtensionsPage()
                            }
'''
              replacement = anchor + '''
                            entry<Screen.DaFeiYuSettings> {
                                DaFeiYuSettingsPage()
                            }
'''
              s = s.replace(anchor, replacement)
          if 'data object DaFeiYuSettings : Screen' not in s:
              anchor = '''    @Serializable
    data object Extensions : Screen
'''
              replacement = anchor + '''
    @Serializable
    data object DaFeiYuSettings : Screen
'''
              s = s.replace(anchor, replacement)
          route.write_text(s)

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug -x processDebugGoogleServices

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-dafeiyu-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Commit fixed build sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot].users.noreply.github.com'
          git add app/src/main/java/me/rerere/rikkahub/ui/pages/chat/ChatVM.kt app/src/main/java/me/rerere/rikkahub/di/ViewModelModule.kt app/src/main/java/me/rerere/rikkahub/RouteActivity.kt
          git commit -m 'fix: finish 大肥鱼 settings integration [dafeiyu-finished]' || exit 0
          git push
