name: Build 大肥鱼 APK

on:
  push:
    paths:
      - 'app/src/main/java/me/rerere/rikkahub/whale/DaFeiYuWidget.kt'
      - 'app/src/main/assets/dafeiyu/debug.js'
      - '.github/workflows/finish-dafeiyu.yml'

permissions:
  contents: write

concurrency:
  group: dafeiyu-build
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[dafeiyu-finished]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Patch build-only dependencies and widget layout
        shell: python
        run: |
          from pathlib import Path
          vm = Path('app/src/main/java/me/rerere/rikkahub/ui/pages/chat/ChatVM.kt')
          s = vm.read_text()
          s = s.replace('import com.google.firebase.analytics.FirebaseAnalytics\n', '')
          s = s.replace('    private val analytics: FirebaseAnalytics,\n', '')
          s = s.replace('        analytics.logEvent("ai_send_message", null)\n\n', '')
          s = s.replace('        analytics.logEvent("ai_edit_message", null)\n\n', '')
          s = s.replace('        analytics.logEvent("ai_regenerate_at_message", null)\n', '')
          s = s.replace('        analytics.logEvent("ai_tool_approval", null)\n', '')
          s = s.replace('        analytics.logEvent("ai_tool_answer", null)\n', '')
          vm.write_text(s)
          mod = Path('app/src/main/java/me/rerere/rikkahub/di/ViewModelModule.kt')
          s = mod.read_text().replace('            analytics = get(),\n', '')
          mod.write_text(s)

          route = Path('app/src/main/java/me/rerere/rikkahub/RouteActivity.kt')
          s = route.read_text()
          # The checked-in RouteActivity normally uses fillMaxSize(). For the build-only
          # integration keep the WebView host small so it cannot sit over the whole app.
          old = '''                                    DaFeiYuWidget(\n                                        modifier = Modifier.fillMaxSize()\n                                    )'''
          new = '''                                    DaFeiYuWidget(\n                                        modifier = Modifier\n                                            .align(Alignment.BottomEnd)\n                                            .width(320.dp)\n                                            .height(320.dp)\n                                    )'''
          if old in s:
              s = s.replace(old, new, 1)
          elif '.align(Alignment.BottomEnd).width(320.dp).height(320.dp)' not in s and 'DaFeiYuWidget(' in s:
              raise SystemExit('DaFeiYuWidget layout anchor not found')
          # The build-only layout uses width()/height(); add imports only when needed.
          if '.width(320.dp)' in s and 'import androidx.compose.foundation.layout.width\n' not in s:
              marker = 'import androidx.compose.foundation.layout.fillMaxSize\n'
              if marker in s:
                  s = s.replace(marker, marker + 'import androidx.compose.foundation.layout.height\nimport androidx.compose.foundation.layout.width\n', 1)
              else:
                  raise SystemExit('fillMaxSize import anchor not found')
          route.write_text(s)

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug -x processDebugGoogleServices

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-dafeiyu-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Commit fixed build sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot].users.noreply.github.com'
          git add app/src/main/java/me/rerere/rikkahub/ui/pages/chat/ChatVM.kt app/src/main/java/me/rerere/rikkahub/di/ViewModelModule.kt app/src/main/java/me/rerere/rikkahub/RouteActivity.kt
          git commit -m 'fix: finish 大肥鱼 performance optimization [dafeiyu-finished]' || exit 0
          git push
