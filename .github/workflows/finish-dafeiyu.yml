name: Build 大肥鱼 APK

on:
  push:
    paths:
      - 'app/src/main/java/me/rerere/rikkahub/whale/DaFeiYuWidget.kt'
      - '.github/workflows/finish-dafeiyu.yml'

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[dafeiyu-finished]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Patch Firebase-only analytics dependency
        shell: python
        run: |
          from pathlib import Path
          vm = Path('app/src/main/java/me/rerere/rikkahub/ui/pages/chat/ChatVM.kt')
          s = vm.read_text()
          s = s.replace('import com.google.firebase.analytics.FirebaseAnalytics\n', '')
          s = s.replace('    private val analytics: FirebaseAnalytics,\n', '')
          s = s.replace('        analytics.logEvent("ai_send_message", null)\n\n', '')
          s = s.replace('        analytics.logEvent("ai_edit_message", null)\n\n', '')
          s = s.replace('        analytics.logEvent("ai_regenerate_at_message", null)\n', '')
          s = s.replace('        analytics.logEvent("ai_tool_approval", null)\n', '')
          s = s.replace('        analytics.logEvent("ai_tool_answer", null)\n', '')
          vm.write_text(s)

          mod = Path('app/src/main/java/me/rerere/rikkahub/di/ViewModelModule.kt')
          s = mod.read_text().replace('            analytics = get(),\n', '')
          mod.write_text(s)

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug -x processDebugGoogleServices

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-dafeiyu-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Commit fixed build sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/me/rerere/rikkahub/ui/pages/chat/ChatVM.kt app/src/main/java/me/rerere/rikkahub/di/ViewModelModule.kt
          git commit -m 'fix: avoid Firebase analytics dependency in standalone build [dafeiyu-finished]' || exit 0
          git push
