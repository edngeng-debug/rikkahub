name: Finish 大肥鱼 port

on:
  push:
    paths:
      - 'app/src/main/java/me/rerere/rikkahub/whale/DaFeiYuWidget.kt'

permissions:
  contents: write

jobs:
  port:
    if: ${{ !contains(github.event.head_commit.message, '[dafeiyu-finished]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Enable pnpm cache
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('web-ui/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install web dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Download original widget assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/dafeiyu
          base='https://raw.githubusercontent.com/MeteorNOX/DeepSeek-Balance-Whale-Widget/main/assets'
          curl -fsSL "$base/whale-widget.js" -o app/src/main/assets/dafeiyu/whale-widget.js
          curl -fsSL "$base/DSniang1.png" -o app/src/main/assets/dafeiyu/DSniang1.png
          curl -fsSL "$base/DSniang02.png" -o app/src/main/assets/dafeiyu/DSniang02.png
          curl -fsSL "$base/rua.gif" -o app/src/main/assets/dafeiyu/rua.gif
          curl -fsSL "$base/Ya1.mp3" -o app/src/main/assets/dafeiyu/Ya1.mp3
          curl -fsSL "$base/Ya2.mp3" -o app/src/main/assets/dafeiyu/Ya2.mp3
          curl -fsSL "$base/D1.mp3" -o app/src/main/assets/dafeiyu/D1.mp3
          curl -fsSL "$base/D2.mp3" -o app/src/main/assets/dafeiyu/D2.mp3
          sed -i 's/小鲸鱼/大肥鱼/g; s/鲸鱼/大肥鱼/g' app/src/main/assets/dafeiyu/whale-widget.js

      - name: Replace widget host with local asset host
        shell: bash
        run: |
          cat > app/src/main/java/me/rerere/rikkahub/whale/DaFeiYuWidget.kt <<'EOF'
          package me.rerere.rikkahub.whale

          import android.annotation.SuppressLint
          import android.graphics.Color
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.viewinterop.AndroidView
          import java.io.ByteArrayInputStream

          @SuppressLint("SetJavaScriptEnabled")
          @Composable
          fun DaFeiYuWidget(modifier: Modifier = Modifier) {
              Box(modifier = modifier) {
                  AndroidView(
                      modifier = Modifier.fillMaxSize(),
                      factory = { context ->
                          WebView(context).apply {
                              setBackgroundColor(Color.TRANSPARENT)
                              settings.javaScriptEnabled = true
                              settings.domStorageEnabled = true
                              settings.allowFileAccess = false
                              settings.allowContentAccess = false
                              settings.mediaPlaybackRequiresUserGesture = false
                              isVerticalScrollBarEnabled = false
                              isHorizontalScrollBarEnabled = false
                              webViewClient = DaFeiYuWebViewClient(context)
                              val script = context.assets.open("dafeiyu/whale-widget.js").bufferedReader().use { it.readText() }
                              loadDataWithBaseURL(
                                  "https://rikkahub.local/",
                                  """
                                  <!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"></head>
                                  <body style="margin:0;background:transparent;overflow:hidden"><div id="root"><textarea aria-hidden="true" style="position:absolute;left:-9999px"></textarea></div>
                                  <script>$script</script></body></html>
                                  """.trimIndent(),
                                  "text/html",
                                  "UTF-8",
                                  null,
                              )
                          }
                      },
                  )
              }
          }

          private class DaFeiYuWebViewClient(private val context: android.content.Context) : WebViewClient() {
              override fun shouldInterceptRequest(view: WebView?, request: WebResourceRequest): WebResourceResponse? {
                  return when (request.url.path) {
                      "/dsh-whale/image.png" -> asset("dafeiyu/DSniang1.png", "image/png", null)
                      "/dsh-whale/rua.gif" -> asset("dafeiyu/rua.gif", "image/gif", null)
                      "/dsh-whale/sound/press.mp3" -> asset(if (request.url.getQueryParameter("set") == "fx1") "dafeiyu/D1.mp3" else "dafeiyu/Ya1.mp3", "audio/mpeg", null)
                      "/dsh-whale/sound/release.mp3" -> asset(if (request.url.getQueryParameter("set") == "fx1") "dafeiyu/D2.mp3" else "dafeiyu/Ya2.mp3", "audio/mpeg", null)
                      "/dsh-whale/balance.json" -> json("{\"balance\":0,\"currency\":\"CNY\"}")
                      "/dsh-whale/size.json" -> json("{\"scale\":1,\"sound\":true,\"vol\":1,\"soundSet\":\"duck\",\"usageMode\":\"ledger\",\"peakMode\":\"auto\",\"bubbleOn\":true,\"turnCostOn\":true,\"turnCostCloseMs\":5000}")
                      "/dsh-whale/last-turn.json" -> json("{\"seq\":0,\"cost\":0}")
                      else -> super.shouldInterceptRequest(view, request)
                  }
              }

              private fun asset(path: String, mime: String, encoding: String?): WebResourceResponse =
                  WebResourceResponse(mime, encoding, context.assets.open(path))

              private fun json(body: String) = WebResourceResponse(
                  "application/json",
                  "UTF-8",
                  ByteArrayInputStream(body.toByteArray(Charsets.UTF_8)),
              )
          }
          EOF

      - name: Add widget to chat route
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('app/src/main/java/me/rerere/rikkahub/RouteActivity.kt')
          s = p.read_text()

          imp = 'import me.rerere.rikkahub.whale.DaFeiYuWidget\n'
          if imp not in s:
              marker = 'import me.rerere.rikkahub.utils.openUsageAccessSettings\n'
              if marker not in s:
                  raise SystemExit('RouteActivity import marker not found')
              s = s.replace(marker, marker + imp, 1)

          for imp, marker in [
              ('import androidx.compose.foundation.layout.width\n', 'import androidx.compose.foundation.layout.padding\n'),
              ('import androidx.compose.foundation.layout.height\n', 'import androidx.compose.foundation.layout.padding\n'),
          ]:
              if imp not in s:
                  if marker not in s:
                      raise SystemExit(f'RouteActivity layout import marker not found: {imp.strip()}')
                  s = s.replace(marker, marker + imp, 1)

          if 'DaFeiYuWidget(' not in s:
              pattern = re.compile(
                  r'(?P<indent>\s*)ChatPage\(\s*'
                  r'id = Uuid\.parse\(key\.id\),\s*'
                  r'text = key\.text,\s*'
                  r'files = key\.files\.map \{ it\.toUri\(\) \},\s*'
                  r'nodeId = key\.nodeId\?\.let \{ Uuid\.parse\(it\) \}\s*'
                  r'\)',
                  re.MULTILINE,
              )
              match = pattern.search(s)
              if not match:
                  raise SystemExit('ChatPage anchor not found; aborting without commit')
              indent = match.group('indent')
              replacement = (
                  f'{indent}Box(modifier = Modifier.fillMaxSize()) {{\n'
                  f'{indent}    ChatPage(\n'
                  f'{indent}        id = Uuid.parse(key.id),\n'
                  f'{indent}        text = key.text,\n'
                  f'{indent}        files = key.files.map {{ it.toUri() }},\n'
                  f'{indent}        nodeId = key.nodeId?.let {{ Uuid.parse(it) }}\n'
                  f'{indent}    )\n'
                  f'{indent}    DaFeiYuWidget(\n'
                  f'{indent}        modifier = Modifier\n'
                  f'{indent}            .align(Alignment.BottomEnd)\n'
                  f'{indent}            .width(320.dp)\n'
                  f'{indent}            .height(320.dp)\n'
                  f'{indent}    )\n'
                  f'{indent}}}'
              )
              s = s[:match.start()] + replacement + s[match.end():]

          p.write_text(s)

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug -x processDebugGoogleServices

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-dafeiyu-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Commit completed port
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/dafeiyu app/src/main/java/me/rerere/rikkahub/whale/DaFeiYuWidget.kt app/src/main/java/me/rerere/rikkahub/RouteActivity.kt
          git commit -m 'feat: finish 大肥鱼 widget port [dafeiyu-finished]' || exit 0
          git push
