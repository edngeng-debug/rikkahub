name: Mobile Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/deepseek-whale-widget

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Restore settings page from master and add whale entry
        run: |
          git fetch origin master
          git show origin/master:app/src/main/java/me/rerere/rikkahub/ui/pages/setting/SettingPage.kt > app/src/main/java/me/rerere/rikkahub/ui/pages/setting/SettingPage.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/me/rerere/rikkahub/ui/pages/setting/SettingPage.kt')
          s = p.read_text()
          marker = 'import me.rerere.rikkahub.ui.context.LocalNavController\n'
          s = s.replace(marker, marker + '\nprivate const val WHALE_WIDGET_URL = "rikkahub://whale-widget"\n', 1)
          needle = '''                    item(\n                        onClick = { navController.navigate(Screen.Extensions) },\n                        leadingContent = { Icon(HugeIcons.Package, null) },\n                        supportingContent = { Text(stringResource(R.string.setting_page_extensions_desc)) },\n                        headlineContent = { Text(stringResource(R.string.setting_page_extensions)) },\n                    )\n'''
          addition = needle + '''                    item(\n                        onClick = { navController.navigate(Screen.WebView(WHALE_WIDGET_URL)) },\n                        leadingContent = { Text("🐳", style = MaterialTheme.typography.titleLarge) },\n                        supportingContent = { Text("DeepSeek 余额、今日消耗与 RikkaHub 实际 Token 用量") },\n                        headlineContent = { Text("小鲸鱼记账") },\n                    )\n'''
          if needle not in s:
              raise SystemExit('settings insertion point not found')
          s = s.replace(needle, addition, 1)
          p.write_text(s)
          PY

      - name: Provide CI-only Google Services config
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "rikkahub-ci",
              "storage_bucket": "rikkahub-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "me.rerere.rikkahub.debug"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK output
        run: |
          echo "APK files:"
          find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print
          test -n "$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-mobile-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

# Build verification trigger: keep this workflow on the feature branch.
