<!doctype html>
<html lang="zh-CN">
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta charset="utf-8">
  <style>
    html,body,#root{margin:0;width:100%;height:100%;padding:0;overflow:visible;background:transparent}
    body{touch-action:none}
    #root textarea{position:absolute;left:-10000px;top:-10000px;width:1px;height:1px;opacity:0}
  </style>
</head>
<body>
  <div id="root"><textarea id="rikkahub-composer" aria-hidden="true"></textarea></div>
  <script>
    // The upstream whale-widget.js is loaded unchanged from the bundled submodule.
    (function(){
      var nativeFetch=window.fetch.bind(window);
      function nativeResponse(body,type){
        return new Response(body,{status:200,headers:{'Content-Type':type||'application/json; charset=utf-8'}});
      }
      window.fetch=async function(input,init){
        var url=typeof input==='string'?input:(input&&input.url)||'';
        var method=((init&&init.method)||((input&&input.method)||'GET')).toUpperCase();
        if(url.indexOf('/dsh-whale/')!==-1 && window.RikkaHubWhaleBridge){
          var parsed=new URL(url,location.href);
          var path=parsed.pathname+parsed.search;
          if(method==='PUT'||method==='POST'){
            var body=(init&&init.body)||'';
            return nativeResponse(window.RikkaHubWhaleBridge.putJson(path,String(body)));
          }
          return nativeResponse(window.RikkaHubWhaleBridge.getJson(path));
        }
        return nativeFetch(input,init);
      };
    })();
  </script>
  <script src="/dsh-whale/widget.js"></script>
</body>
</html>
